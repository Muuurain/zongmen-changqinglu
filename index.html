<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#14161f">
<title>宗门长青录</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-ready="false">
  <section id="start-screen" aria-labelledby="start-title">
    <div class="start-panel">
      <h1 id="start-title">宗门长青录</h1>
      <p id="start-save-info">正在载入宗门存档……</p>
      <div id="start-actions" class="start-actions">
        <button id="btn-continue" class="btn primary" disabled>继续上次修行</button>
        <button id="btn-new-game" class="btn" disabled>开创新宗门</button>
        <button id="btn-start-load" class="btn" disabled>读取存档</button>
      </div>
      <form id="new-game-form" class="new-game-form hidden">
        <label>初代宗主姓名<input id="leader-name" name="leaderName" value="顾长风" maxlength="20" required autocomplete="off"></label>
        <label>性别<select id="leader-gender" name="leaderGender"><option value="男">男</option><option value="女">女</option></select></label>
        <label>宗门名称<input id="new-sect-name" name="sectName" value="青云观" maxlength="20" required autocomplete="off"></label>
        <div id="new-game-error" class="form-error" aria-live="polite"></div>
        <div class="start-actions">
          <button type="button" class="btn" onclick="UI.cancelNewGame()">返回</button>
          <button type="submit" class="btn primary">开宗立派</button>
        </div>
      </form>
    </div>
  </section>
  <div id="game-screen" class="hidden">
  <!-- 顶部：宗门信息 + 资源栏 -->
  <header id="topbar">
    <div class="sect-info">
      <span id="sect-name" class="sect-name">青云观</span>
      <span id="sect-date" class="sect-date">太元元年 一月</span>
      <span id="sect-rep" class="sect-rep">声望：10</span>
    </div>
    <div id="resource-bar" class="resource-bar"></div>
    <div class="top-actions">
      <button id="btn-bgm" class="btn small" title="音乐开关">♪</button>
      <button id="btn-save" class="btn small">存档</button>
      <button id="btn-load" class="btn small">读档</button>
      <button id="btn-menu" class="btn small" title="返回开始界面">主菜单</button>
      <button id="btn-next-month" class="btn primary">闭关一月 ▸</button>
    </div>
  </header>

  <div id="main">
    <!-- 侧边导航 -->
    <nav id="sidenav">
      <button class="nav-btn active" data-view="overview">宗门总览</button>
      <button class="nav-btn" data-view="disciples">弟子 <span id="nav-disciple-count"></span></button>
      <button class="nav-btn" data-view="elders">长老院</button>
      <button class="nav-btn" data-view="buildings">建筑产业</button>
      <button class="nav-btn" data-view="adventure">外出历练</button>
      <button class="nav-btn" data-view="trade">商路贸易</button>
      <button class="nav-btn" data-view="diplomacy">外交势力</button>
      <button class="nav-btn" data-view="spirit">灵界分宗</button>
      <button class="nav-btn" data-view="recruit">招募弟子</button>
      <button class="nav-btn" data-view="log">宗门志</button>
    </nav>

    <!-- 主内容区 -->
    <section id="content">
      <div id="view-overview" class="view"></div>
      <div id="view-disciples" class="view hidden"></div>
      <div id="view-elders" class="view hidden"></div>
      <div id="view-buildings" class="view hidden"></div>
      <div id="view-adventure" class="view hidden"></div>
      <div id="view-trade" class="view hidden"></div>
      <div id="view-diplomacy" class="view hidden"></div>
      <div id="view-spirit" class="view hidden"></div>
      <div id="view-recruit" class="view hidden"></div>
      <div id="view-log" class="view hidden"></div>
    </section>
  </div>

  <audio id="bgm" src="assets/bgm_main.mp3" loop></audio>

  <!-- v1.1.1：全局 HUD 印章（固定于主界面右下角，不遮挡任何弹窗内容） -->
  <div id="hud-logo"><img src="assets/ui/ui_seal_stamp.png" alt="" onerror="this.parentNode.style.display='none'"></div>
  </div>

  <!-- 通用弹窗 -->
  <div id="modal-mask" class="modal-mask hidden">
    <div id="modal" class="modal"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
